<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hwang EunYoung</title>

  <style>
    /* =====================================
       1. 기본 레이아웃
    ===================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
    }

    .portfolio {
      display: flex;
      align-items: flex-start;
      gap: 80px;
      padding: 30px 36px;
      font-family: serif;
      line-height: 2;
      font-size: 13px;
    }

    .portfolio nav {
      flex: 0 0 auto;
    }

    .portfolio #content {
      flex: 1;
      min-width: 0;
      padding-top: 2em;
    }

    .portfolio #menu > div {
      cursor: pointer;
    }

    /* =====================================
       2. PC 작품 이미지
    ===================================== */

    #artwork img {
      display: block;
      width: 75%;
      max-width: 75%;
      height: auto;
      margin: 0 0 18px 0;
      object-fit: contain;
    }

    /* 뒤로 가기 버튼: PC에서는 숨김 */
    #backButton {
      display: none;
      border: none;
      background: none;
      padding: 0 0 16px 0;
      font-family: serif;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
    }

    /* =====================================
       3. 모바일 화면
    ===================================== */

    @media screen and (max-width: 768px) {
      .portfolio {
        flex-direction: column;
        align-items: stretch;
        gap: 0;
        width: 100%;
        min-height: 100vh;
        padding: 16px;
        font-size: 13px;
        line-height: 1.8;
      }

      .portfolio nav {
        width: 100%;
        flex: none;
      }

      .portfolio #menu {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        gap: 0;
        width: 100%;
        margin-top: 8px;
      }

      .portfolio #menu > div {
        width: fit-content;
        max-width: 100%;
        overflow-wrap: normal;
      }

      /* 메뉴 화면에서는 작품 영역 숨김 */
      .portfolio:not(.show-artwork) #content {
        display: none;
      }

      /* 작품 화면에서는 메뉴 숨김 */
      .portfolio.show-artwork nav {
        display: none;
      }

      .portfolio.show-artwork #content {
        display: block;
        width: 100%;
        min-width: 0;
        padding-top: 0;
      }

      /* 뒤로 가기 버튼 */
      .portfolio.show-artwork #backButton {
        display: block;
      }

      /* 모바일 이미지 너비 */
      #artwork {
        width: 100%;
      }

      #artwork img {
        display: block;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        max-height: none !important;
        object-fit: contain;
        margin: 0 0 18px 0;
      }

      #artwork .artwork-caption {
        width: 100%;
        max-width: 100%;
        margin-bottom: 18px;
        font-size: 14px;
        white-space: pre-line;
      }
    }
  </style>
</head>

<body>

<div class="portfolio" id="portfolio">

  <!-- 메뉴 화면 -->
  <nav>
    <p style="color: black; margin: 0;">
      Hwang EunYoung
    </p>

    <div id="menu"></div>
  </nav>

  <!-- 작품 화면 -->
  <main id="content">
    <button id="backButton" type="button" aria-label="작품 목록으로 돌아가기">
      ←
    </button>

    <div id="artwork"></div>
  </main>

</div>

<script>
/* =====================================
   1. 왼쪽 메뉴 전체 목록
===================================== */

const works = [
  "contact",
  "CV",
  "Four Sounds",
  "Passing Time, Eternal Beauty",
  '7" × 5"',
  '5 1/2" × 4 1/4"',
  "GOOD ARTIST",
  "Holes",
  "Points before Lines",
  "Lines before Points",
  "Left",
  "Erase this. No,leave this.",
  "Once Twice Three times Four times",
  "Yes",
  "Yes or No or Yes or No or",
  "Books",
  "To be kept in this order",
  "---2026--------------------------",
  "Four Corners",
  "Bookmark",
  "Artist's Plate",
  "Artist's Plate",
  "An Abridged Book",
  "Inkjet Photo Painting by Printer",
  "Oil Painting",
  "Business Cards",
  "---2025--------------------------",
  "E-flat",
  "Books",
  "ABC business card",
  "Coloring Book",
  "Coloring Book",
  "at the same time",
  "Talking Heads",
  "Action Pointing",
  "Air Mailed by Airmail",
  "Arc",
  "Back",
  "Different Colored Circles",
  "ㄷㄷㄹ"
];


/* =====================================
   2. 작품별 내용
===================================== */

const contents = {};

works.forEach((work) => {
  contents[work] = {
    type: "text",
    value: work
  };
});

contents["contact"] = {
  type: "text",
  value: "eunyoung.hwg@gmail.com"
};

contents["CV"] = {
  type: "text",
  value: `Education
2020–2024, Seoul
Exhibitions
2025, Seoul`
};


/* =====================================
   3. 작품 사진 등록
===================================== */

contents["Four Sounds"] = {
  type: "image",
  value: [
    "four-sounds_015.jpg",
    "four-sounds_011.jpg",
    "four-sounds_012.jpg",
    "four-sounds_013.jpg",
    "four-sounds_018.jpg",
  ],
  caption: `Four Sounds,
Micah Lexier, Hwang Eunyoung
2026`
};

  contents["Passing Time, Eternal Beauty"] = {
  type: "image",
  value: [
    "B_09.jpg",
    "B_08.jpg",
    "B_04.jpg",
    "B_10.jpg",
    "B_12.jpg",
  ],
  caption: `Passing Time, Eternal Beauty,
Hwang Eunyoung
2026`
};

   contents["GOOD ARTIST"] = {
  type: "image",
  value: [
    "G_01.jpg",
  ],
  caption: `HWANG EUNYOUNG
  GOOD ARTIST
  BY APPOINMTMEMNT ONLY
  2026`
};


/* =====================================
   4. 메뉴와 화면 전환
===================================== */

const portfolio = document.getElementById("portfolio");
const menu = document.getElementById("menu");
const content = document.getElementById("content");
const artwork = document.getElementById("artwork");
const backButton = document.getElementById("backButton");

/* 메뉴 화면으로 돌아가기 */
function showMenu() {
  portfolio.classList.remove("show-artwork");
  window.scrollTo(0, 0);
}

backButton.addEventListener("click", showMenu);

/* 작품 표시 */
function showWork(work) {
  const data = contents[work];

  artwork.replaceChildren();

  if (!data) return;

  if (data.type === "image") {
    // 작품 캡션
    const caption = document.createElement("div");
    caption.className = "artwork-caption";
    caption.textContent = data.caption || "";
    caption.style.whiteSpace = "pre-line";
    caption.style.width = "70%";
    caption.style.marginBottom = "18px";
    caption.style.fontSize = "14px";
    caption.style.textAlign = "left";

    artwork.appendChild(caption);

    // 이미지 한 장 또는 여러 장
    const images = Array.isArray(data.value)
      ? data.value
      : [data.value];

    images.forEach((src) => {
      const img = document.createElement("img");

      img.src = src;
      img.alt = work;

      artwork.appendChild(img);
    });

  } else {
    const text = document.createElement("div");

    text.style.whiteSpace = "pre-line";
    text.textContent = data.value;

    artwork.appendChild(text);
  }

  // 모바일에서는 작품 화면으로 전환
  if (window.matchMedia("(max-width: 768px)").matches) {
    portfolio.classList.add("show-artwork");
    window.scrollTo(0, 0);
  }
}




/* =====================================
   5. 메뉴 생성 및 선택한 작품 표시
===================================== */

let selectedWork = null;

works.forEach((work) => {
  const item = document.createElement("div");

  item.textContent = work;

  // Four Sounds는 항상 빨간색
  if (work === "Four Sounds") {
    item.style.color = "red";
  }

  // 연도 구분선은 클릭할 수 없음
  if (work.startsWith("---")) {
    item.style.cursor = "default";
    item.style.pointerEvents = "none";
  } else {
    item.style.cursor = "pointer";

    item.addEventListener("click", () => {

      // 이전에 선택한 메뉴의 색상 복원
      if (selectedWork) {
        selectedWork.style.color =
          selectedWork.textContent === "Four Sounds"
            ? "red"
            : "black";
      }

      // 현재 클릭한 메뉴 저장
      selectedWork = item;

      // 클릭한 메뉴는 모두 레몬옐로우
item.style.color = "#FFF44F";

      // 선택한 작품 표시
      showWork(work);
    });
  }

  menu.appendChild(item);
});
</script>

</body>
</html>
