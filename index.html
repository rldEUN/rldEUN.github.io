<div style="display: flex; gap: 80px; font-family: serif; line-height: 2; font-size: 12px;">

  <!-- 왼쪽 메뉴 -->
  <nav style="flex: 0 0 auto;">

    <!-- 작가 이름: 클릭되지 않음 -->
    <p style="color: black; margin: 0;">
      Hwang EunYoung
    </p>

    <div id="menu"></div>

  </nav>

  <!-- 오른쪽 내용: 처음에는 비어 있음 -->
  <main
    id="content"
    style="flex: 1; min-width: 0; padding-top: 2em;"
  ></main>

</div>

<script>
/* =====================================
   1. 왼쪽 메뉴 전체 목록
===================================== */

const works = [
  "contact",
  "CV",
  "Four Sounds",
  "Passing Time, Eternal Beauty",
  '7" × 5"',
  '5 1/2" × 4 1/4"',
  "GOOD ARTIST",
  "Holes",
  "Points before Lines",
  "Lines before Points",
  "Left",
  "Erase this. No,leave this.",
  "Once Twice Three times Four times",
  "Yes",
  "Yes or No or Yes or No or",
  "Books",
  "To be kept in this order",
  "Four Corners",
  "Bookmark",
  "Artist's Plate",
  "Artist's Plate",
  "An Abridged Book",
  "Inkjet Photo Painting by Printer",
  "Oil Painting",
  "Business Cards",
  "E-flat",
  "Books",
  "ABC business card",
  "Coloring Book",
  "Coloring Book",
  "at the same time",
  "Talking Heads",
  "Action Pointing",
  "Air Mailed by Airmail",
  "Arc",
  "Back",
  "Different Colored Circles",
  "ㄷㄷㄹ"
];


/* =====================================
   2. 작품별 내용

   모든 작품은 기본적으로 제목을 표시해.
   사진을 추가할 때 해당 작품에 등록하면 돼.
===================================== */

const contents = {};

works.forEach((work) => {
  contents[work] = {
    type: "text",
    value: work
  };
});
contents["contact"] = {
  type: "text",
  value: "eunyoung.hwg@gmail.com"
};
contents["CV"] = {
  type: "text",
  value: `Education
2020–2024, Seoul
Exhibitions
2025, Seoul`
};
/* =====================================
   3. 사진 등록 예시

   실제 사진을 GitHub에 업로드한 뒤
   아래 주석을 지우고 경로를 수정해.

   contents["Four Sounds"] = {
     type: "image",
     value: "images/four-sounds.jpg"
   };

===================================== */

// 사진을 추가할 작품만 아래에 등록하면 돼.


/* =====================================
   4. 왼쪽 메뉴 생성
===================================== */

const menu = document.getElementById("menu");
const content = document.getElementById("content");

works.forEach((work, index) => {

  const item = document.createElement("div");

  item.textContent = work;
  item.style.cursor = "pointer";

  item.addEventListener("click", () => {

    content.replaceChildren();

    const data = contents[work];

    if (data.type === "image") {

      const img = document.createElement("img");

      img.src = data.value;
      img.alt = work;
      img.style.display = "block";
      img.style.maxWidth = "100%";
      img.style.height = "auto";

      content.appendChild(img);

    } else {

      const text = document.createElement("div");
      text.style.whiteSpace = "pre-line";
      text.textContent = data.value;
      content.appendChild(text);

    }

  });

  menu.appendChild(item);

});
</script>
