<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hwang EunYoung</title>
</head>
  
<body>
<style>
  /* ================================
     1. 기본 레이아웃
  ================================ */

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
  }

  .portfolio {
    display: flex;
    align-items: flex-start;
    gap: 80px;
    padding: 0;
    font-family: serif;
    line-height: 2;
    font-size: 13px;
  }

  .portfolio nav {
    flex: 0 0 auto;
  }

  .portfolio #content {
    flex: 1;
    min-width: 0;
    padding-top: 2em;
  }

  .portfolio #menu > div {
    cursor: pointer;
  }

  /* ================================
     2. 작품 이미지
  ================================ */

  .portfolio #content img {
    display: block;
    width: 70%;
    max-width: 70%;
    height: auto;
    margin: 0 0 18px 0;
    object-fit: contain;
  }

  /* ================================
     3. 모바일 최적화
  ================================ */

  @media screen and (max-width: 768px) {
    .portfolio {
      flex-direction: column;
      gap: 12px;
      width: 100%;
      padding: 12px;
      font-size: 13px;
      line-height: 1.8;
    }

    .portfolio nav {
      width: 100%;
      flex: none;
    }

    .portfolio #menu {
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  gap: 0;
  width: 100%;
}

.portfolio #menu > div {
  width: fit-content;
  max-width: 100%;
  overflow-wrap: normal;
}

    .portfolio #menu > div {
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .portfolio #content {
      width: 100%;
      min-width: 0;
      padding-top: 12px;
    }

    .portfolio #content img {
      width: 100% !important;
      max-width: 100% !important;
      max-height: none !important;
      height: auto !important;
      object-fit: contain;
    }

    .portfolio #content div {
      max-width: 100%;
      box-sizing: border-box;
    }
  }
</style>

<div class="portfolio">

  <!-- 왼쪽 메뉴 / 모바일에서는 상단 -->
  <nav>
    <p style="color: black; margin: 0;">
      Hwang EunYoung
    </p>

    <div id="menu"></div>
  </nav>

  <!-- 작품 내용 -->
  <main id="content"></main>

</div>

<script>
/* =====================================
   1. 왼쪽 메뉴 전체 목록
===================================== */

const works = [
  "contact",
  "CV",
  "Four Sounds",
  "Passing Time, Eternal Beauty",
  '7" × 5"',
  '5 1/2" × 4 1/4"',
  "GOOD ARTIST",
  "Holes",
  "Points before Lines",
  "Lines before Points",
  "Left",
  "Erase this. No,leave this.",
  "Once Twice Three times Four times",
  "Yes",
  "Yes or No or Yes or No or",
  "Books",
  "To be kept in this order",
  "---2026--------------------------",
  "Four Corners",
  "Bookmark",
  "Artist's Plate",
  "Artist's Plate",
  "An Abridged Book",
  "Inkjet Photo Painting by Printer",
  "Oil Painting",
  "Business Cards",
  "---2025--------------------------",
  "E-flat",
  "Books",
  "ABC business card",
  "Coloring Book",
  "Coloring Book",
  "at the same time",
  "Talking Heads",
  "Action Pointing",
  "Air Mailed by Airmail",
  "Arc",
  "Back",
  "Different Colored Circles",
  "ㄷㄷㄹ"
];


/* =====================================
   2. 작품별 내용
===================================== */

const contents = {};

works.forEach((work) => {
  contents[work] = {
    type: "text",
    value: work
  };
});

contents["contact"] = {
  type: "text",
  value: "eunyoung.hwg@gmail.com"
};

contents["CV"] = {
  type: "text",
  value: `Education
2020–2024, Seoul
Exhibitions
2025, Seoul`
};


/* =====================================
   3. 작품 사진 등록
===================================== */

contents["Four Sounds"] = {
  type: "image",
  value: [
    "four-sounds_004.jpg",
    "four-sounds_005.jpg"
  ],
  caption: `Four Sounds,
Micah Lexier, Hwang Eunyoung
2026`
};


/* =====================================
   4. 왼쪽 메뉴 생성
===================================== */

const menu = document.getElementById("menu");
const content = document.getElementById("content");

works.forEach((work) => {
  const item = document.createElement("div");

  item.textContent = work;

  if (work === "Four Sounds") {
    item.style.color = "#FF0000";
  }

  if (work.startsWith("---")) {
    item.style.cursor = "default";
  } else {
    item.style.cursor = "pointer";

    item.addEventListener("click", () => {
      content.replaceChildren();

      const data = contents[work];

      if (data.type === "image") {
        const wrapper = document.createElement("div");
        wrapper.style.width = "100%";

        // 작품 캡션
        const caption = document.createElement("div");
        caption.textContent = data.caption || "";
        caption.style.whiteSpace = "pre-line";
        caption.style.width = "70%";
        caption.style.marginBottom = "18px";
        caption.style.fontSize = "14px";
        caption.style.textAlign = "left";
        caption.style.boxSizing = "border-box";

        wrapper.appendChild(caption);

        // 이미지 한 장 또는 여러 장 표시
        const images = Array.isArray(data.value)
          ? data.value
          : [data.value];

        images.forEach((src) => {
          const img = document.createElement("img");

          img.src = src;
          img.alt = work;

          img.style.display = "block";
          img.style.width = "70%";
          img.style.maxWidth = "70%";
          img.style.height = "auto";
          img.style.maxHeight = "none";
          img.style.objectFit = "contain";
          img.style.margin = "0 0 18px 0";
          img.style.boxSizing = "border-box";

          wrapper.appendChild(img);
        });

        content.appendChild(wrapper);

      } else {
        const text = document.createElement("div");

        text.style.whiteSpace = "pre-line";
        text.textContent = data.value;

        content.appendChild(text);
      }
    });
  }

  menu.appendChild(item);
});
</script>
  </body>
</html>
